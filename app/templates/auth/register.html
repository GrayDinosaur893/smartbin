{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-xl shadow-lg border border-slate-100">
    <h2 class="text-2xl font-bold text-slate-900 mb-2">Create SmartBin Account</h2>
    <p class="text-sm text-slate-500 mb-6">Earn Eco-Points & Micro Cash Rewards for reporting waste.</p>

    {% if error %}
        <div class="bg-red-50 text-red-700 p-3 rounded-lg text-sm mb-4 border border-red-200">
            <i class="fa-solid fa-triangle-exclamation mr-1"></i> {{ error }}
        </div>
    {% endif %}

    <form method="POST" action="/register">
        <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Full Name</label>
            <input type="text" name="name" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>

        <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
            <input type="email" name="email" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>

        <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Phone Number</label>
            <input type="text" name="phone" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>

        <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Select Role</label>
            <select name="role" class="w-full px-3 py-2 border rounded-lg bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
                <option value="citizen">Citizen (Report & Track Waste)</option>
                <option value="driver">Garbage Truck Driver / Worker</option>
                <option value="admin">Municipal Authority / Officer</option>
            </select>
        </div>

        <div class="mb-6">
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Password</label>
            <input type="password" name="password" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg shadow transition">
            Create Account
        </button>
    </form>
</div>
{% endblock %}
