{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto mt-12 bg-white p-8 rounded-xl shadow-lg border border-slate-100">
    <h2 class="text-2xl font-bold text-slate-900 mb-2">SmartBin Portal Login</h2>
    <p class="text-sm text-slate-500 mb-6">Select your role to access your dedicated dashboard.</p>

    {% if error %}
        <div class="bg-red-50 text-red-700 p-3 rounded-lg text-sm mb-4 border border-red-200">
            <i class="fa-solid fa-triangle-exclamation mr-1"></i> {{ error }}
        </div>
    {% endif %}

    <form method="POST" action="/login">
        <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Select Role</label>
            <div class="grid grid-cols-3 gap-2">
                <label class="cursor-pointer border p-2 rounded-lg text-center text-xs font-semibold peer-checked:bg-emerald-600">
                    <input type="radio" name="role" value="citizen" class="mr-1" {% if role == 'citizen' %}checked{% endif %}> Citizen
                </label>
                <label class="cursor-pointer border p-2 rounded-lg text-center text-xs font-semibold">
                    <input type="radio" name="role" value="driver" class="mr-1" {% if role == 'driver' %}checked{% endif %}> Worker
                </label>
                <label class="cursor-pointer border p-2 rounded-lg text-center text-xs font-semibold">
                    <input type="radio" name="role" value="admin" class="mr-1" {% if role == 'admin' %}checked{% endif %}> Admin
                </label>
            </div>
        </div>

        <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
            <input type="email" name="email" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>

        <div class="mb-6">
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Password</label>
            <input type="password" name="password" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg shadow transition">
            Sign In to SmartBin
        </button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-500">
        Don't have an account? <a href="/register" class="text-emerald-600 font-semibold hover:underline">Register here</a>
    </div>
</div>
{% endblock %}
